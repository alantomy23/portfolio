<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      padding: 1rem;
    }

    .grid-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .grid-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .grid-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .grid-item:hover img {
      transform: scale(1.05);
    }

    .grid-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Optional scrollbar hiding */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h4 class="text-center mb-4">Photography Gallery</h4>

  <div class="grid-gallery" id="gallery">
    <div class="grid-item"><img src="images/portfolio/gallery/pic1.jpg" alt="1"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic2.jpg" alt="2"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic3.jpg" alt="3"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic4.jpg" alt="4"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic5.jpg" alt="5"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic6.jpg" alt="6"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic7.jpg" alt="7"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/baby.jpg" alt="8"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic9.jpg" alt="9"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic10.jpg" alt="10"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic11.jpg" alt="11"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic12.jpg" alt="12"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic13.jpg" alt="13"></div>
    <div class="grid-item"><img src="images/portfolio/gallery/pic14.jpg" alt="14"></div>
  </div>

  <!-- JavaScript for scroll animation -->
  <script>
    const items = document.querySelectorAll('.grid-item');

    const showOnScroll = () => {
      const triggerBottom = window.innerHeight * 0.9;

      items.forEach(item => {
        const itemTop = item.getBoundingClientRect().top;

        if (itemTop < triggerBottom) {
          item.classList.add('visible');
        }
      });
    };

    window.addEventListener('scroll', showOnScroll);
    window.addEventListener('load', showOnScroll);
  </script>

</body>
</html>
